packages: []
linkWorkspacePackages: false
preferWorkspacePackages: false
hoistWorkspacePackages: false
sharedWorkspaceLockfile: true
strictPeerDependencies: true
blockExoticSubdeps: true
lockfileIncludeTarballUrl: true

# pnpm blocks dependency build scripts by default; these need their postinstall
# to run (workerd is wrangler's runtime — wrangler bundles every `pnpm build` and
# `pnpm run deploy <environment>`).
allowBuilds:
  bun: true
  esbuild: true
  sharp: true
  workerd: true
  # Optional native msgpack acceleration; the JS fallback is the portable
  # scaffold baseline and does not require executing a transitive build script.
  msgpackr-extract: false

# Reject newly released third-party packages for seven days. First-party
# public packages are exempt.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  # Vitest 5.0.1 fixes broken public type declarations in 5.0.0.
  - 'vitest@5.0.1'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - 'create-astrale-domain'

# Never install implicitly before `pnpm run` or `pnpm exec`.
verifyDepsBeforeRun: false
# Third-party `.d.ts` files reach their peer `@types` packages by walking parent
# directories, which only works while dependencies live inside the project tree.
# A machine-level global virtual store relocates them outside it and silently
# breaks type resolution, so pin the per-project store for this workspace.
virtualStoreType: project

# GHSA-mrhx-c7xc-m3w5 (high): zod < 4.6.6 can exhaust memory validating large
# arrays. Every published @astrale-os/kernel-dsl still depends on zod 4.4.3 and
# @astrale-os/sdk declares it as an exact peer, so pin the patched release under
# those parents only. A global override would also reach tools run through
# `pnpm dlx` (shadcn needs zod 3). Drop once those packages allow >= 4.6.6.
overrides:
  '@astrale-os/kernel-dsl>zod': 4.6.7
  '@astrale-os/sdk>zod': 4.6.7
