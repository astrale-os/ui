"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "AGENT_SETUP_TOOLS=check bash scripts/setup/setup.sh"
run_mode = "concurrent"

# The playground consumes the built package, so the build has to precede the dev server.
# --strictPort fails loudly rather than sliding to the next port and serving a worktree
# you are not looking at.
[scripts.run.playground]
available_in = [ "local" ]
command = 'pnpm build && pnpm --filter @astrale-os/ui-playground exec vite --port "$CONDUCTOR_PORT" --strictPort'
default = true
icon = "play"

[scripts.run.check]
command = "pnpm test"
icon = "test-tube"
