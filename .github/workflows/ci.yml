name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: astrale-os/config/.github/actions/ci@e0a84a92c9da33aa9046847ca2d32e785a06ec75
        with:
          node-version: ${{ matrix.node-version }}
          frozen-lockfile: 'true'

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: astrale-os/config/.github/actions/setup@e0a84a92c9da33aa9046847ca2d32e785a06ec75
        with:
          frozen-lockfile: 'true'
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
