name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Derive the smallest safe qualification scope
        id: plan
        env:
          INPUT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${INPUT_BASE:-$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)}"
          node scripts/plan-ci.mjs --base "$base" --output "$RUNNER_TEMP/ci-plan.json"
          echo "scope=$(jq -r .plan "$RUNNER_TEMP/ci-plan.json")" >> "$GITHUB_OUTPUT"

  contracts:
    needs: plan
    name: Contracts (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astrale-os/config/.github/actions/setup@8e2e2abd0320be0c2f64033916519ab3b66c7dd7
        with:
          node-version: ${{ matrix.node-version }}
          frozen-lockfile: 'true'
      - name: Run the diff-appropriate contract gate
        env:
          CI_SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          case "$CI_SCOPE" in
            docs-only) pnpm format:check ;;
            request-tooling) pnpm format:check && pnpm lint && pnpm request:check ;;
            family-scoped)
              pnpm format:check
              pnpm lint
              pnpm typecheck
              pnpm request:check
              pnpm registry:check
              pnpm playground:typecheck
              ;;
            global-ui) pnpm check ;;
          esac

  package-and-registry:
    needs: plan
    if: needs.plan.outputs.scope == 'family-scoped' || needs.plan.outputs.scope == 'global-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astrale-os/config/.github/actions/setup@8e2e2abd0320be0c2f64033916519ab3b66c7dd7
        with:
          node-version: 26
          frozen-lockfile: 'true'
      - run: pnpm build
      - run: pnpm test:components
      - run: pnpm test:registry-behavior
      - run: pnpm registry:build
      - run: git diff --exit-code -- registry/registry.json registry/public/r search/public
      - run: pnpm search:benchmark
      - run: pnpm package:qualify
      - run: pnpm registry:qualify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-package-and-registry
          path: |
            artifacts/package/**
            artifacts/registry/**
            registry/public/r/**

  domain:
    needs: plan
    if: needs.plan.outputs.scope == 'global-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: domain/pnpm-lock.yaml
      - run: pnpm --dir domain install --frozen-lockfile
      - run: pnpm --dir domain typecheck
      - run: pnpm --dir domain test
      - run: pnpm --dir domain lint
      - run: pnpm --dir domain build
      - run: pnpm --dir domain package

  security:
    needs: plan
    if: needs.plan.outputs.scope == 'global-ui'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astrale-os/config/.github/actions/setup@8e2e2abd0320be0c2f64033916519ab3b66c7dd7
        with:
          node-version: 24
          frozen-lockfile: 'true'
      - run: pnpm test:security
      - name: Production dependency audit
        run: |
          mkdir -p artifacts/security
          pnpm audit --prod --audit-level high --json > artifacts/security/audit.json
          pnpm licenses list --prod --json > artifacts/security/licenses.json
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: github.event.repository.private == false
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: github.event.repository.private == false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/**

  dependency-review:
    needs: plan
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT
          allow-dependencies-licenses: pkg:npm/victory-vendor@37.3.6

  playground:
    needs: plan
    if: needs.plan.outputs.scope == 'family-scoped' || needs.plan.outputs.scope == 'global-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astrale-os/config/.github/actions/setup@8e2e2abd0320be0c2f64033916519ab3b66c7dd7
        with:
          node-version: 26
          frozen-lockfile: 'true'
      - run: pnpm build
      - run: pnpm playground:build
      - run: pnpm test:playground-unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playground-browser-evidence
          path: |
            playground/playwright-report/**
            artifacts/playground/**

  commitlint:
    needs: plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astrale-os/config/.github/actions/setup@8e2e2abd0320be0c2f64033916519ab3b66c7dd7
        with:
          frozen-lockfile: 'true'
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
