name: Publish

on:
  push:
    branches: [main]
    paths:
      - '.release-please-manifest.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astrale-os/config/.github/actions/publish/packages@2e1bc75459014f38323b57213949b9f9dd530054
        with:
          dirs: 'constants utils styles preset components ui'
          github-token: ${{ github.token }}
          build-command: pnpm build
