name: Agent setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reviewed agent setup standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astrale-os/config
          ref: e60ce6abefe47bc7130bb949a8d8794b58d29a9f
          path: .agent-setup-source
          sparse-checkout: agent-setup
          persist-credentials: false
      - name: Check shared agent setup copies
        run: bash .agent-setup-source/agent-setup/sync.sh --check .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check agent setup without repository dependencies
        run: |
          find scripts/setup -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          node --test .agent-setup-source/agent-setup/*.test.cjs scripts/setup/repo.test.cjs
