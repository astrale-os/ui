name: Brand site

# Checks that brand.astrale.ai still builds from the brand geometry (`pnpm brand:site`) whenever the
# brand changes. Cloudflare deploys it, not this workflow: Workers Builds, connected to this
# repository, builds and deploys the `astrale-brand` Worker on main (see brand/README.md). No
# Cloudflare credential is stored in GitHub.

on:
  pull_request:
    paths:
      - 'packages/ui/src/brand/**'
      - 'brand/**'
      - '.github/workflows/brand.yml'
  push:
    branches: [main]
    paths:
      - 'packages/ui/src/brand/**'
      - 'brand/**'
      - '.github/workflows/brand.yml'
  workflow_dispatch:

concurrency:
  group: brand-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: 'false'
      - uses: astrale-os/config/.github/actions/setup@bdc68eca669ad2905920492249985f251389a946
        with:
          node-version: 26
          frozen-lockfile: 'true'
      - run: pnpm brand:check
      - run: pnpm brand:site
