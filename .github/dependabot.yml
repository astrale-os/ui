# Security updates only. Without this file Dependabot opens each security fix from the directory
# that declares the vulnerable package (`/playground`, `/registry`...), where it cannot see the
# workspace lockfile: it bumps that package.json alone and the frozen install fails in CI.
#
# Starting from the workspace root updates every affected package.json and pnpm-lock.yaml together.
# `domain/` also keeps its own lockfile for standalone installs, so it gets its own entry.
# `open-pull-requests-limit: 0` turns off routine version updates; security updates keep their own
# limit. pnpm's `minimumReleaseAge` still applies: a fix published less than 7 days ago waits.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /domain
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
