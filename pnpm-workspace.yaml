packages:
  - 'packages/*'
  - 'registry'
  - 'playground'
  - 'domain'

linkWorkspacePackages: true
strictPeerDependencies: true

# Block packages released < 7 days ago (10080 minutes) — supply-chain hardening.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - '@jsr/astrale__*'
  - 'create-astrale-domain'

# Never install implicitly before `pnpm run` or `pnpm exec`.
verifyDepsBeforeRun: false

# Allowlist of packages permitted to run install scripts (supply-chain hardening).
allowBuilds:
  '@anthropic-ai/claude-code': false
  '@parcel/watcher': false
  bun: true
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  workerd: true

# Published declarations must resolve their own imports in the global virtual store.
# Remove each version-scoped extension when its upstream manifest is corrected.
packageExtensions:
  '@floating-ui/react-dom@2.1.9':
    peerDependencies:
      '@types/react': '>=16.8.0 <20'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@testing-library/jest-dom@7.0.1':
    dependencies:
      '@types/aria-query': '^5.0.4'
  'cmdk@1.1.1':
    peerDependencies:
      '@types/react': '^18 || ^19'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'input-otp@1.5.0':
